## Per-notebook qsub options for tools/env/nb_submit.sh.
##
## Format: <path prefix>  <qsub options...>  [VAR=value ...]
##   - prefix: a directory (ending in /) or one notebook path, relative to the cookbook root;
##   - the longest matching prefix wins (the whole entry; entries are not merged);
##   - no match: the defaults in the nb_run.sh header (normal, 4 CPUs, 16 GB, 1 h);
##   - tokens like NAME=value (capitals) go to the job's -v list, e.g. CELL_TIMEOUT=7200;
##   - a trailing \ continues the entry on the next line; lines starting with # are comments.
## Note: `-l storage=` REPLACES the header's list, so give the full list
## (gdata/vk83+gdata/yj27+scratch/yj27+...).
## Notebooks that download data need copyq (compute nodes on normal have no internet).

## AODN THREDDS download (internet) + slow model-point extraction (2026-11-03: > 2 h per cell)
recipes/roms/model_eval_moorings.ipynb  -q copyq -l ncpus=1,mem=50GB,walltime=04:00:00 \
    CELL_TIMEOUT=7200

## model output in /g/data/av17 (needs av17 membership)
recipes/roms_mom/  -l ncpus=8,mem=32GB,walltime=02:00:00 \
    -l storage=gdata/vk83+gdata/yj27+scratch/yj27+gdata/av17
